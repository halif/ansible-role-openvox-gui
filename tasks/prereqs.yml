---
# Backend требует Python >= 3.10 — на EL8/EL9 системный python3 младше,
# ставим python3.12 из AppStream явно (см. комментарий в defaults).
- name: Install prerequisite packages (RHEL family)
  ansible.builtin.dnf:
    name:
      - git
      - python3.12
      - python3.12-pip
      - python3.12-devel
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install prerequisite packages (Debian family)
  ansible.builtin.apt:
    name:
      - git
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'
