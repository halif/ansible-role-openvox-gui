---
- name: Clone OpenVox GUI source at the pinned tag
  ansible.builtin.git:
    repo: "{{ openvox_gui_repo_url }}"
    dest: "{{ openvox_gui_source_dir }}"
    version: "{{ openvox_gui_version }}"

# Файл ответов для install.sh -c install.conf -y — доверяем саму
# установку (venv, сборку фронтенда, Alembic-миграции, systemd-юнит)
# официальному скрипту апстрима, а не переписываем его логику здесь.
- name: Render the installer answer file
  ansible.builtin.template:
    src: install.conf.j2
    dest: "{{ openvox_gui_source_dir }}/install.conf"
    mode: '0600'

- name: Run the OpenVox GUI installer (unattended)
  ansible.builtin.command: ./install.sh -c install.conf -y
  args:
    chdir: "{{ openvox_gui_source_dir }}"
    creates: "{{ openvox_gui_install_dir }}/VERSION"
  register: _openvox_gui_install
  environment:
    HOME: /root

- name: Show installer output
  ansible.builtin.debug:
    var: _openvox_gui_install.stdout_lines
