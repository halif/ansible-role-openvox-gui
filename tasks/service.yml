---
# Systemd service management

- name: "Service | Enable openvox-gui service"
  systemd_service:
    name: openvox-gui
    enabled: true
    state: started
  become: true
  register: service_start

- name: "Service | Wait for service to be ready"
  uri:
    url: "http://localhost:{{ openvox_gui_port }}/health"
    method: GET
    status_code: 200
  retries: 5
  delay: 3
  until: result is succeeded
  register: result

- name: "Service | Check service status"
  command: systemctl status openvox-gui
  register: service_status
  changed_when: false
  become: true

- name: "Service | Display service status"
  debug:
    msg: "{{ service_status.stdout_lines }}"
