---
# Configuration files from templates

- name: "Configure | Create .env config from template"
  template:
    src: config.env.j2
    dest: "{{ openvox_gui_home }}/config/.env"
    owner: "{{ openvox_gui_user }}"
    group: "{{ openvox_gui_group }}"
    mode: "0600"
    backup: true
  become: true
  notify: "restart openvox-gui"

- name: "Configure | Create systemd service from template"
  template:
    src: openvox-gui.service.j2
    dest: /etc/systemd/system/openvox-gui.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - "daemon reload"
    - "restart openvox-gui"

- name: "Configure | Create nginx config from template"
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/openvox-gui
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  notify: "validate and reload nginx"

- name: "Configure | Enable nginx site (symlink)"
  file:
    src: /etc/nginx/sites-available/openvox-gui
    dest: /etc/nginx/sites-enabled/openvox-gui
    state: link
    force: true
  become: true
  notify: "validate and reload nginx"

- name: "Configure | Remove default nginx site"
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: "validate and reload nginx"

- name: "Configure | Create preferences.json"
  template:
    src: preferences.json.j2
    dest: "{{ openvox_gui_home }}/config/preferences.json"
    owner: "{{ openvox_gui_user }}"
    group: "{{ openvox_gui_group }}"
    mode: "0644"
  become: true
