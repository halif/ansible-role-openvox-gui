---
# Database initialization

- name: "Database | Check if database exists"
  stat:
    path: "{{ openvox_gui_data_dir }}/openvox.db"
  register: db_file

- name: "Database | Initialize database"
  command:
    cmd: |
      {{ openvox_gui_venv_path }}/bin/python -c "
      import sys
      sys.path.insert(0, '{{ openvox_gui_home }}/backend')
      from app.database import init_db
      import asyncio
      asyncio.run(init_db())
      print('Database initialized successfully')
      "
    chdir: "{{ openvox_gui_home }}"
  become: true
  become_user: "{{ openvox_gui_user }}"
  when: not db_file.stat.exists
  register: db_init

- name: "Database | Display initialization result"
  debug:
    msg: "{{ db_init.stdout }}"
  when: db_init.stdout is defined

- name: "Database | Set database directory permissions"
  file:
    path: "{{ openvox_gui_data_dir }}"
    owner: "{{ openvox_gui_user }}"
    group: "{{ openvox_gui_group }}"
    mode: "0700"
    recurse: true
  become: true
