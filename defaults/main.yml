---
# OpenVox GUI Ansible Role - Default Variables

# ==================== VERSION ====================
openvox_gui_version: "main"  # Branch/tag from GitHub (main, 3.12.0, etc)

# ==================== NETWORK ====================
openvox_gui_host: "0.0.0.0"           # IP to bind to (0.0.0.0 = all interfaces)
openvox_gui_port: 4567                # Port to listen on
openvox_gui_enable_ssl: true          # Enable HTTPS?

# ==================== PUPPET SERVICES ====================
openvox_gui_puppetdb_host: "127.0.0.1"      # PuppetDB host
openvox_gui_puppetdb_port: 8081             # PuppetDB port
openvox_gui_puppet_server_host: "127.0.0.1" # PuppetServer host
openvox_gui_puppet_server_port: 8140        # PuppetServer port

# ==================== AUTHENTICATION ====================
openvox_gui_auth_backend: "local"  # Authentication: local, ldap, none
openvox_gui_ldap_server: ""        # LDAP server (if auth_backend=ldap)
openvox_gui_ldap_base_dn: ""       # LDAP base DN (e.g. dc=example,dc=com)

# ==================== DATABASE ====================
openvox_gui_database_url: "sqlite:///opt/openvox-gui/data/openvox.db"
# For production with Postgres: "postgresql://user:pass@host:5432/openvox_gui"

# ==================== PATHS & PERMISSIONS ====================
openvox_gui_user: "puppet"                        # Service user
openvox_gui_group: "puppet"                       # Service group
openvox_gui_home: "/opt/openvox-gui"              # Installation directory
openvox_gui_venv_path: "/opt/openvox-gui/venv"    # Python venv location
openvox_gui_data_dir: "/opt/openvox-gui/data"     # Data directory
openvox_gui_log_dir: "/var/log/openvox-gui"       # Log directory

# ==================== SSL CERTIFICATES ====================
openvox_gui_ssl_cert_path: "/etc/ssl/certs/openvox-gui.crt"
openvox_gui_ssl_key_path: "/etc/ssl/private/openvox-gui.key"

# ==================== SYSTEM ====================
openvox_gui_python_version: "3.10"    # Minimum Python version required
openvox_gui_debug: false              # Debug mode (DANGEROUS in production!)
openvox_gui_workers: 4                # Number of uvicorn workers
