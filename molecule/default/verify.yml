---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check that the openvox-gui service is active
      ansible.builtin.systemd:
        name: openvox-gui.service
      register: _openvox_gui_service
      until: _openvox_gui_service.status.ActiveState == 'active'
      retries: 24
      delay: 10

    - name: Verify openvox-gui is listening on port 4567
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 4567
        timeout: 60
