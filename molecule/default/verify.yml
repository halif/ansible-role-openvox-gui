---
- name: Verify
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check Python version
      debug:
        msg: "Python version: {{ ansible_python_version }}"

    - name: Check if required packages are installed
      package_facts:
        manager: auto
      register: _pkg_facts

    - name: Verify required packages
      assert:
        that:
          - "'python3-pip' in _pkg_facts.ansible_facts.ansible_pkg_mgr or 'python3-devel' in _pkg_facts.ansible_facts.ansible_pkg_mgr"
          - "'git' in _pkg_facts.ansible_facts.ansible_pkg_mgr"
          - "'nginx' in _pkg_facts.ansible_facts.ansible_pkg_mgr"
        fail_msg: "Required packages are not installed"

    - name: Check if openvox-gui directories exist
      stat:
        path: "{{ item }}"
      loop:
        - /opt/openvox-gui
        - /opt/openvox-gui/data
        - /var/log/openvox-gui
      register: dir_check

    - name: Verify all directories exist
      assert:
        that:
          - item.stat.exists and item.stat.isdir
        fail_msg: "Directory {{ item.item }} does not exist"
      loop: "{{ dir_check.results }}"

    - name: Check if OpenVox GUI repo is cloned
      stat:
        path: /opt/openvox-gui/.git
      register: git_dir

    - name: Verify repository is cloned
      assert:
        that:
          - git_dir.stat.exists
        fail_msg: "OpenVox GUI repository not cloned"

    - name: Check if Python venv exists
      stat:
        path: /opt/openvox-gui/venv/bin/python
      register: venv_python

    - name: Verify venv created
      assert:
        that:
          - venv_python.stat.exists
        fail_msg: "Python venv not created"

    - name: Check FastAPI installation
      command: /opt/openvox-gui/venv/bin/python -c "import fastapi; print(fastapi.__version__)"
      register: fastapi_check
      changed_when: false

    - name: Verify FastAPI is installed
      debug:
        msg: "FastAPI version: {{ fastapi_check.stdout }}"

    - name: Check if .env config exists
      stat:
        path: /opt/openvox-gui/config/.env
      register: env_file

    - name: Verify .env config exists
      assert:
        that:
          - env_file.stat.exists
        fail_msg: ".env config file not found"

    - name: Check if systemd service exists
      stat:
        path: /etc/systemd/system/openvox-gui.service
      register: service_file

    - name: Verify systemd service exists
      assert:
        that:
          - service_file.stat.exists
        fail_msg: "Systemd service file not found"

    - name: Check if OpenVox GUI service is active
      systemd_service:
        name: openvox-gui
      register: service_status
      until: service_status.status.ActiveState == 'active'
      retries: 12
      delay: 5

    - name: Verify service is active
      assert:
        that:
          - service_status.status.ActiveState == 'active'
        fail_msg: "OpenVox GUI service is not active"

    - name: Wait for OpenVox GUI API to be ready
      wait_for:
        host: 127.0.0.1
        port: 4567
        timeout: 30
        delay: 2

    - name: Check OpenVox GUI health endpoint
      uri:
        url: "http://127.0.0.1:4567/health"
        method: GET
      register: health_check
      retries: 6
      delay: 5
      until: health_check.status == 200

    - name: Verify health endpoint responds
      assert:
        that:
          - health_check.status == 200
          - "'ok' in health_check.json.status"
        fail_msg: "Health endpoint does not respond correctly"

    - name: Check if nginx is installed and running
      systemd_service:
        name: nginx
      register: nginx_status

    - name: Verify nginx is active
      assert:
        that:
          - nginx_status.status.ActiveState == 'active'
        fail_msg: "nginx service is not active"

    - name: Display verification summary
      debug:
        msg: |
          ✓ All verifications passed!
          - User: puppet
          - Directories created
          - Repository cloned
          - Python venv created
          - Python dependencies installed
          - Configuration files created
          - Systemd service configured
          - OpenVox GUI service running
          - API health endpoint responding
          - nginx reverse proxy active
