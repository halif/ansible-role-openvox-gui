---
# Molecule конфигурация для тестирования роли

driver:
  name: docker  # Используем Docker для создания тестовых контейнеров

platforms:
  # Тестируем на разных ОС
  - name: ubuntu2204-openvox
    image: "geerlingguy/docker-ubuntu2204-ansible:latest"
    override_command: false
    command: "/sbin/init"  # Используй init вместо /bin/bash
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw  # Нужно для systemd в контейнере
    cgroupns_mode: host
    privileged: true  # Привилегированный контейнер (нужен для systemd)

  - name: debian12-openvox
    image: "geerlingguy/docker-debian12-ansible:latest"
    override_command: false
    command: "/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

  - name: rockylinux9-openvox
    image: "geerlingguy/docker-rockylinux9-ansible:latest"
    override_command: false
    command: "/usr/sbin/init"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true

provisioner:
  name: ansible  # Используем Ansible для запуска роли
  inventory:
    group_vars:
      all:
        ansible_user: "root"  # Запускаем от root в контейнере

scenario:
  test_sequence:
    # Порядок выполнения тестов
    - destroy      # 1. Удали старые контейнеры
    - create       # 2. Создай новые контейнеры
    - converge     # 3. Запусти роль
    - idempotence  # 4. Запусти роль ещё раз (не должно быть изменений!)
    - verify       # 5. Проверь результат
    - destroy      # 6. Удали контейнеры

verifier:
  name: ansible  # Используем Ansible для проверки
