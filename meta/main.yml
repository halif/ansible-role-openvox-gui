---
galaxy_info:
  role_name: openvox_gui
  namespace: halif
  author: halif
  description: Install OpenVox GUI, a web dashboard for OpenVox/Puppet infrastructure
  license: MIT
  min_ansible_version: "2.14"

  platforms:
    - name: Ubuntu
      versions:
        - jammy   # 22.04
        - noble   # 24.04
    - name: Debian
      # bullseye/11 not supported — ships Python 3.9, backend requires 3.10+
      versions:
        - bookworm  # 12
    - name: EL
      versions:
        - "8"
        - "9"

  galaxy_tags:
    - puppet
    - openvox
    - dashboard
    - monitoring

dependencies: []
