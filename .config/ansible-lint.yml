---
# Ansible-lint конфигурация
# Проверяет, что ты следуешь лучшим практикам

skip_list:
  - yaml[line-length]  # Не проверяй длину строк в YAML
  # Можешь добавить сюда правила, которые хочешь игнорировать

warn_list:
  - undefined-variable  # Предупреждай, но не фейлай

# Это помогает ловить ошибки, которые hard найти в runtime