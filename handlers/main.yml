---
# Handlers - deferred actions

- name: "restart openvox-gui"
  systemd_service:
    name: openvox-gui
    state: restarted
  become: true
  listen: "restart openvox-gui"

- name: "reload nginx"
  systemd_service:
    name: nginx
    state: reloaded
  become: true
  listen: "reload nginx"

- name: "daemon reload"
  systemd_service:
    daemon_reload: true
  become: true
  listen: "daemon reload"

- name: "validate and reload nginx"
  block:
    - name: Validate nginx config
      command: nginx -t
      become: true
    
    - name: Reload nginx
      systemd_service:
        name: nginx
        state: reloaded
      become: true
  listen: "validate and reload nginx"
