---
# Handlers - deferred actions

- name: "restart openvox-gui"
  listen: "restart openvox-gui"
  systemd_service:
    name: openvox-gui
    state: restarted
  become: true

- name: "reload nginx"
  listen: "reload nginx"
  systemd_service:
    name: nginx
    state: reloaded
  become: true

- name: "daemon reload"
  listen: "daemon reload"
  systemd_service:
    daemon_reload: true
  become: true

- name: "validate and reload nginx"
  listen: "validate and reload nginx"
  block:
    - name: Validate nginx config
      command: nginx -t
      become: true

    - name: Reload nginx
      systemd_service:
        name: nginx
        state: reloaded
      become: true
